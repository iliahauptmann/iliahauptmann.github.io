<body><a class="skip-link" href="#inventory-title">К карте квартир</a><main>
<header class="page-head"><div><h1>Как продаются квартиры в ЖК</h1></div></header>
<section class="control-panel" aria-label="Фильтры фонда">
<div class="controls"><label>Корпус<select id="building" aria-label="Корпус"><option value="">Все корпуса</option></select></label><label>Комнатность<select id="rooms" aria-label="Комнатность"><option value="">Все квартиры</option><option value="1">1 комната</option><option value="2">2 комнаты</option><option value="3">3 комнаты</option><option value="4">4 комнаты</option></select></label><label>Этаж<select id="floor" aria-label="Этаж"><option value="">Все этажи</option><option value="2-5">2-5</option><option value="6-9">6-9</option><option value="10-19">10-19</option><option value="20-29">20-29</option></select></label><label>Площадь, м²<select id="area" aria-label="Площадь, м²"><option value="">Любая</option><option value="<60">До 60</option><option value="60-79">60 - менее 80</option><option value="80-99">80 - менее 100</option><option value="100-119">100 - менее 120</option><option value="120+">От 120</option></select></label><label class="date-control">Срез на конец дня<input id="cutoff" type="date" min="2026-03-01" max="2026-09-30" value="2026-09-30"></label><button class="btn reset" id="reset">Сбросить всё</button></div>
<div class="active-row" id="active-row" hidden><div id="active-filters" aria-label="Активные фильтры"></div></div>
<div class="headline-stats" id="headline-stats" aria-live="polite"></div>
</section>
<div class="dashboard">
<figure class="panel main-panel" aria-labelledby="inventory-title"><figcaption class="panel-head"><div><h2 id="inventory-title" tabindex="-1">Весь фонд: корпус и этаж</h2><p>Одно окно = квартира. Сравниваем проданные со всем фондом.</p></div><span class="scope-badge" id="inventory-scope"></span></figcaption>
<div class="inventory-legend"><span><i class="swatch sold"></i>Продана</span><span><i class="swatch remaining"></i>Не продана*</span><span class="manager-key" id="manager-key" hidden><i class="swatch other"></i>Другие менеджеры</span><span class="outside-key" id="outside-key" hidden><i class="swatch outside"></i>Вне фильтров</span><span class="atom-encoding"><b class="mini-window">2</b>Число: комнат · Ширина: м²</span></div>
<p class="mobile-hint">Прокручивай карту по горизонтали. Нажми на окно для подробностей.</p>
<div class="chart-wrap" tabindex="0" role="region" aria-label="Карта всего фонда квартир"><svg id="inventory" role="group" aria-labelledby="inventory-svg-title inventory-svg-desc"></svg></div>
<p class="chart-help">Нажми на название корпуса или диапазон этажей слева, чтобы отфильтровать все графики. Под корпусом: доля и продано / фонд. Соседние корпуса сохраняются для сравнения. Окна размещены условно, это не архитектурный план.</p>
<div class="main-reading" id="main-reading"></div>
<div class="assumption-note">* Продана = есть сделка к выбранной дате. Без записи о продаже считаем непроданной (учебное допущение). Состав фонда за период принят постоянным.</div>
</figure>
<aside class="side-panels" aria-label="Дополнительные графики">
<figure class="panel weekly-panel" aria-labelledby="weekly-title"><figcaption class="panel-head compact"><h2 id="weekly-title">Продажи по неделям</h2><label class="compact-select"><span class="sr-only">Показатель по неделям</span><select id="week-mode" aria-label="Показатель по неделям"><option value="count">Сделки</option><option value="revenue">Выручка</option><option value="discount">Скидки</option></select></label></figcaption><div id="weekly-summary" class="panel-summary"></div><svg id="weekly" viewBox="0 0 440 175" role="group" aria-label="Недельная динамика продаж"></svg><p class="panel-note">Нажми неделю: срез на её конец. Последняя неделя неполная.</p></figure>
<figure class="panel rates-panel" aria-labelledby="rates-title"><figcaption class="panel-head compact"><h2 id="rates-title">Доля распроданного</h2><label class="compact-select"><span class="sr-only">Сравнить продаваемость по</span><select id="rate-dimension" aria-label="Сравнить продаваемость по"><option value="rooms">Комнатности</option><option value="building">Корпусам</option><option value="floor">Этажам</option><option value="area">Площади</option><option value="view">Виду из окон</option><option value="layout">Планировкам</option></select></label></figcaption><div class="bar-list" id="rates" aria-label="Продаваемость групп"></div><p class="panel-note">Шкала 0-100%. В подписи: продано / весь фонд. Клик по строке фильтрует ЖК.</p></figure>
<figure class="panel managers-panel" aria-labelledby="managers-title"><figcaption class="panel-head compact"><h2 id="managers-title">Результаты менеджеров</h2><label class="compact-select"><span class="sr-only">Показатель менеджеров</span><select id="manager-mode" aria-label="Показатель менеджеров"><option value="revenue">Выручка</option><option value="count">Сделки</option><option value="discountRate">Скидка, %</option></select></label></figcaption><div class="bar-list manager-list" id="managers" aria-label="Результаты менеджеров"></div><p class="panel-note" id="manager-note">Клик выделяет сделки менеджера. Фонд и общая распроданность сохраняются.</p></figure>
</aside></div>
<footer>Источник: Продажи ЖК, март-сентябрь 2026.xlsx</footer>
</main>

    for(const v of a){const b=document.createElement('button');b.type='button';b.className='manager-row'+(state.manager===v.key?' active':'');b.dataset.manager=v.key;b.dataset.count=v.count;b.dataset.revenue=v.revenue;b.dataset.discount=v.discount;b.setAttribute('aria-pressed',String(state.manager===v.key));const value=mode==='discountRate'?pct(v.discountRate,2):mode==='count'?fmt(v.count):money(v.revenue);b.setAttribute('aria-label',`${v.label}: ${v.count} сделок, выручка ${rub(v.revenue)}, скидка ${pct(v.discountRate,2)}. Выделить сделки.`);b.innerHTML=`<span class="bar-head"><span class="label">${esc(v.label)}</span><span class="value">${value}<span class="n">${mode==='count'?'скидка '+pct(v.discountRate,2):v.count+' шт.'}</span></span></span><span class="bar-track manager-track" aria-hidden="true"><span class="manager-fill" style="width:${(v[mode]??0)/max*100}%"></span></span>`;b.addEventListener('click',()=>toggleFilter('manager',v.key));b.addEventListener('pointerenter',event=>{const r=M.fund(records,state).filter(d=>d.manager===v.key&&M.isSold(d,state.cutoff)),mix=[1,2,3,4].map(k=>`${k}к: ${r.filter(d=>d.rooms===k).length}`).join(', ');showTip(`<strong>${esc(v.label)}</strong><br>${v.count} ${plural(v.count,'сделка','сделки','сделок')}<br>Выручка: ${rub(v.revenue)}<br>Скидки: ${rub(v.discount)} (${pct(v.discountRate,2)})<br>Состав: ${mix}<br>Конверсия неизвестна: нет лидов и назначенного фонда.`,event);});b.addEventListener('pointerleave',hideTip);b.addEventListener('pointermove',moveTip);root.append(b);}
    if(!a.length)root.innerHTML='<p class="bar-empty">К выбранной дате продаж в этой группе нет.</p>';
    $('manager-note').textContent=mode==='discountRate'?'Скидки / стоимость до скидок. Меньшая скидка сама по себе не доказывает эффективность.':'Клик выделяет сделки менеджера. Фонд и общая распроданность сохраняются.';
  }
  function captureFilterFocus(){
    const active=document.activeElement;
    for(const [kind,selector,key]of [['week','.week-bar','week'],['rate','.rate-row','group'],['manager','.manager-row','manager']]){
      if(active?.matches(selector))return {kind,key:active.dataset[key]};
    }
    if(active?.matches('.chip'))return {kind:'chip',index:[...$('active-filters').children].indexOf(active)};
    return null;
  }
  function restoreFilterFocus(focus){
    if(!focus)return;
    const targets={week:['#weekly .week-bar','week'],rate:['#rates .rate-row','group'],manager:['#managers .manager-row','manager']};
    let target;
    if(focus.kind==='chip'){
      const buttons=[...$('active-filters').children];target=buttons[Math.min(focus.index,buttons.length-1)]||$('reset');
    }else{
      const [selector,key]=targets[focus.kind];target=[...document.querySelectorAll(selector)].find(node=>node.dataset[key]===focus.key)||$('reset');
    }
    target?.focus({preventScroll:true});
  }
  function update(){
    const focus=captureFilterFocus();
    hideTip();const t=M.totals(records,state);updateTop(t);updateInventory(t);renderWeeks(t);renderRates();renderManagers();restoreFilterFocus(focus);
    document.title='Как продаются квартиры в ЖК'+(state.building?' | '+state.building:'');
  }
  function section(title,pairs){return `<section class="deal-section"><h3>${esc(title)}</h3><dl>${pairs.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section>`;}
  function openApartment(d,source){
    hideTip();openSource=source;selectedApartment=d.apartment;windowElements.forEach(e=>e.classList.remove('is-open'));windowElements.get(d.apartment)?.classList.add('is-open');
    const sold=M.isSold(d,state.cutoff);$('apartment-title').textContent=d.apartment;
    $('apartment-content').innerHTML=`<div class="property-overview"><strong>${d.rooms}-комнатная, ${fmt(d.area,1)} м²</strong><p>Корпус ${esc(d.building)} · ${d.floor} этаж</p><span class="status-pill${sold?'':' unsold'}">${sold?'Продана '+date(d.deal_date):'Не продана к '+date(state.cutoff)+'*'}</span></div>`+section('Квартира',[['Планировка',d.layout],['Вид',d.view_raw],['Стоимость до скидки',rub(d.cost)],['Базовая цена за м²',rub(d.cost/d.area)]])+(sold?section('Зафиксированная сделка',[['Дата обращения',date(d.contact_date)],['Дата сделки',date(d.deal_date)],['Сумма после скидки',rub(d.amount)],['Скидка',rub(d.discount)],['Доля скидки',pct(d.discount/d.cost,2)],['Фактическая цена за м²',rub(d.amount/d.area)],['Дней от обращения',String(d.days)]])+section('Участники',[['Менеджер',d.manager],['Покупатель','Данные в выгрузке отсутствуют']]):'<p class="dialog-note">Продажа к выбранной дате в источнике не зафиксирована. Квартира остаётся в знаменателе фонда. Для учебного анализа это непроданный остаток; стоимость до скидки не является подтверждённой выручкой.</p>')+`<div class="dialog-actions"><button class="btn" id="filter-this-building">Выбрать корпус ${esc(d.building)}</button><button class="btn" id="filter-this-type">Выбрать ${d.rooms}-комнатные</button></div>`;
    const layoutButton=document.createElement('button');layoutButton.type='button';layoutButton.className='btn';layoutButton.id='filter-this-layout';layoutButton.textContent='Выбрать планировку '+d.layout;
    $('apartment-content').querySelector('.dialog-actions').append(layoutButton);
    layoutButton.addEventListener('click',()=>{$('apartment-dialog').close();state.layout=d.layout;modes.rate='layout';$('rate-dimension').value='layout';update();});
    $('filter-this-building').addEventListener('click',()=>{$('apartment-dialog').close();state.building=d.building;update();});$('filter-this-type').addEventListener('click',()=>{$('apartment-dialog').close();state.rooms=String(d.rooms);update();});$('apartment-dialog').showModal();
  }
  for(const key of ['building','rooms','floor','area'])$(key).addEventListener('change',event=>{state[key]=event.target.value||null;update();});
  $('cutoff').addEventListener('change',event=>{const v=event.target.value;if(!v||v<'2026-03-01'||v>M.defaultCutoff){$('cutoff').value=state.cutoff;return;}state.cutoff=v;update();});
  $('reset').addEventListener('click',reset);
  $('week-mode').addEventListener('change',event=>{modes.week=event.target.value;renderWeeks(M.totals(records,state));});
  $('rate-dimension').addEventListener('change',event=>{modes.rate=event.target.value;renderRates();});
  $('manager-mode').addEventListener('change',event=>{modes.manager=event.target.value;renderManagers();});
  $('close-apartment').addEventListener('click',()=>$('apartment-dialog').close());
  $('apartment-dialog').addEventListener('close',()=>{openSource?.focus();if(selectedApartment)windowElements.get(selectedApartment)?.classList.remove('is-open');});
  for(const dialog of [$('apartment-dialog')])dialog.addEventListener('click',event=>{if(event.target!==dialog)return;const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();});
  window.addEventListener('scroll',hideTip,{passive:true});$('inventory').parentElement.addEventListener('scroll',hideTip,{passive:true});
  buildInventory();update();
})();
</script>
</body></html>
